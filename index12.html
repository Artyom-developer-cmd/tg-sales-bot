<!DOCTYPE HTML>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра "Солдат"</title>

<style>
body {
    margin: 0;
    padding: 0;
}

h1 {
    font-family: "Times New Roman", Times, serif;
    font-size: 28pt;
}

.sunsistem {
    position: relative;
    top: 0;
    left: 0;
}

#soldier {
    position: absolute;
    top: 0;
    left: 0;
    margin: 260px 0 0 100px;
}

#gun {
    position: absolute;
    top: 0;
    left: 0;
    margin: 500px 0 0 350px;
}

#helmet {
    position: absolute;
    top: 0;
    left: 0;
    margin: 180px 0 0 600px;
}

#medal {
    position: absolute;
    top: 0;
    left: 0;
    margin: 350px 0 0 700px;
}

#cap {
    position: absolute;
    top: 0;
    left: 0;
    margin: 120px 0 0 450px;
}

#message {
    position: absolute;
    font-family: "Times New Roman", Times, serif;
    background-color: black;
    color: white;
    font-size: 20pt;
    top: 0;
    left: 0;
    margin: 100px 0 0 320px;
    padding: 5px;
}
</style>

</head>
<body>

<h1>Soldier</h1>

<div class="sunsistem">
    <img src="images/phon.jpg" width="1000" height="700">
</div>

<span class="planeti">
    <img id="soldier" src="images/soldier.jpg" width="140" height="260">
    <img id="gun" src="images/gun.jpg" width="180" height="100">
    <img id="helmet" src="images/helmet.jpg" width="120" height="100">
    <img id="medal" src="images/medal.jpg" width="100" height="100">
    <img id="cap" src="images/cap.jpg" width="120" height="90">
</span>

<span id="message"></span>

<script>
"use strict";

const MASSIV = [
    "soldier",
    "gun",
    "helmet",
    "medal",
    "cap"
];

const shuffle = array => {
    let currentIndex = array.length, randomIndex;

    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        [array[currentIndex], array[randomIndex]] =
        [array[randomIndex], array[currentIndex]];
    }

    return array;
}

const shuffledObjects = shuffle(MASSIV);
let currentIndex = 0;

const addEventListenerToObject = () => {
    if (currentIndex >= shuffledObjects.length) {
        document.getElementById("message").innerText =
        "Вы прошли игру!";
        return;
    }

    document.getElementById("message").innerText =
    "Найди предмет " + shuffledObjects[currentIndex];

    document.getElementById(shuffledObjects[currentIndex])
    .addEventListener("click", function(event) {
        event.preventDefault();

        this.style.opacity = "0";
        this.style.transition = "0.5s";

        currentIndex++;

        addEventListenerToObject();
    });
};

addEventListenerToObject();
</script>

</body>
</html>
